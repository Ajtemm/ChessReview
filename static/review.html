<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review · Chess Review</title>
  <link rel="stylesheet" href="/static/vendor/chessground/chessground.base.css">
  <link rel="stylesheet" href="/static/vendor/chessground/chessground.cburnett.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/review.css">
</head>
<body>
  <main class="review-page">
    <header class="review-header">
      <a class="back-link" href="/">← Partije</a>
      <div class="review-title">
        <h1>Game Review</h1>
        <span class="muted" id="game-meta"></span>
      </div>
    </header>

    <div class="review">
      <!-- Tabla sa eval barom i igračima -->
      <section class="board-col">
        <div class="player" id="player-top"></div>
        <div class="board-row">
          <div class="eval-bar" id="eval-bar" title="Ocena pozicije">
            <div class="eval-fill" id="eval-fill"></div>
            <span class="eval-text" id="eval-text"></span>
          </div>
          <div class="board-wrap">
            <div id="board" class="cg-wrap"></div>
            <div class="board-icon" id="board-icon" hidden></div>
          </div>
        </div>
        <div class="player" id="player-bottom"></div>
      </section>

      <!-- Desni panel: tačnost, grafikon, objašnjenje, potezi, navigacija -->
      <aside class="side panel">
        <div class="accuracy" id="accuracy"></div>

        <details class="counts">
          <summary>Statistika poteza</summary>
          <table id="counts"></table>
        </details>

        <div class="chart-wrap">
          <canvas id="chart" aria-label="Grafikon ocene kroz partiju"></canvas>
          <div class="chart-empty muted" id="chart-empty" hidden>Grafikon će se pojaviti kad analiza bude gotova.</div>
        </div>

        <div class="coach" id="coach"></div>

        <div class="moves" id="moves"></div>

        <nav class="nav">
          <button type="button" id="btn-first" title="Početak (↑)" aria-label="Početak">⏮</button>
          <button type="button" id="btn-prev" title="Potez nazad (←)" aria-label="Potez nazad">◀</button>
          <button type="button" id="btn-next" title="Potez napred (→)" aria-label="Potez napred">▶</button>
          <button type="button" id="btn-last" title="Kraj (↓)" aria-label="Kraj">⏭</button>
          <button type="button" id="btn-flip" title="Okreni tablu (F)" aria-label="Okreni tablu">⇅</button>
          <button type="button" id="btn-sound" title="Isključi zvuk (M)" aria-label="Isključi zvuk">🔊</button>
        </nav>
      </aside>
    </div>

    <div class="message error" id="error" hidden></div>
  </main>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script type="module" src="/static/review.js"></script>
</body>
</html>
